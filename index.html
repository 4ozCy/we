<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celvyn</title>
    <meta property="og:title" content="Celvyn Hub" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="fast easy and simple." />
    <meta property="og:image" content="https://celvyn.site/celvyn.png" />
    <meta name="theme-color" content="#fb9814">
    <meta name="twitter:card" content="summary_large_image">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.25.0/themes/prism-tomorrow.min.css">
    <link href="https://fonts.cdnfonts.com/css/minecraft-3" rel="stylesheet">
    <style>
        body {
            font-family: 'Minecraft', sans-serif;
            width: 100%;
            margin: 0;
            padding: 0;
            background: #000;
            min-height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            flex-direction: column;
            gap: 20px;
        }

        #particles-js {
            position: absolute;
            width: 100%;
            height: 90vh;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .container {
            width: 90%;
            background: #19191a;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 3px 5px rgba(225, 225, 225, 0.3);
            text-align: center;
            animation: fadeIn 1s ease-out;
            position: relative;
            box-sizing: border-box;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 1em;
        }

        .main-header h1 {
            font-size: 48px;
            font-weight: bold;
            margin: 0;
            color: #ffffff;
            animation: slideIn 1.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .main-header p {
            font-size: 20px;
            margin: 10px 0;
            color: #d3d3d3;
        }

        .logo {
            width: 200px;
            margin-bottom: 20px;
            animation: fadeIn 5s ease-out;
        }

        .features ul {
            list-style: none;
            padding: 0;
        }

        .features li {
            font-size: 18px;
            margin: 10px 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.3s;
        }

        .features li:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .features li span {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #00ff85;
            border-radius: 50%;
        }

        .script {
            background: #19191a;
            width: 85%;
            color: #38bdf8;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 3px 5px rgba(225, 225, 225, 0.3);
            text-align: left;
            font-size: 16px;
            overflow-x: auto;
            position: relative;
        }

        .copy-icon {
            position: absolute;
            top: 4px;
            right: 5px;
            cursor: pointer;
            font-size: 1em;
            color: whitesmoke;
            transition: transform 0.3s, color 0.3s;
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>

    <img src="celvyn.png" alt="Celvyn Logo" class="logo">

    <div class="container main-header">
        <h1><span style="color: orange;">Celvyn</span> - <span style="color: lightgreen;">Beta</span></h1>
        <p>fast easy and simple</p>
    </div>

    <div class="container">
        <h1> Honorable Mention to <span style="color: orange;">Chatgpt</span> and <span style="color: lightgreen;"> Copilot</span></h1>
    </div>

    <div class="container features" id="features">
        <ul>
            <li><span></span> Aimbot & Esp</li>
            <li><span></span> Server hop</li>
            <li><span></span> Play random music</li>
            <li><span></span> Open Source</li>
            <li><span></span> More Coming soon..</li>
        </ul>
    </div>

    <div class="script">
        <pre><code class="language-lua">loadstring(game:HttpGet('https://celvyn.site/hub'))()</code></pre>
        <i data-lucide="copy" class="copy-icon" onclick="copyScript()"></i>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.25.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.25.0/components/prism-lua.min.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        lucide.createIcons();

        particlesJS('particles-js', {
            "particles": {
                "number": {
                    "value": 100,
                    "density": {
                        "enable": true,
                        "value_area": 900
                    }
                },
                "color": {
                    "value": "#ffffff"
                },
                "shape": {
                    "type": "circle",
                    "stroke": {
                        "width": 0,
                        "color": "#000000"
                    },
                    "polygon": {
                        "nb_sides": 5
                    }
                },
                "opacity": {
                    "value": 0.5,
                    "random": false,
                    "anim": {
                        "enable": false,
                        "speed": 0.5,
                        "opacity_min": 0.1,
                        "sync": false
                    }
                },
                "size": {
                    "value": 5,
                    "random": true,
                    "anim": {
                        "enable": false,
                        "speed": 40,
                        "size_min": 0.1,
                        "sync": false
                    }
                },
                "line_linked": {
                    "enable": true,
                    "distance": 150,
                    "color": "#ffffff",
                    "opacity": 0.4,
                    "width": 1
                },
                "move": {
                    "enable": true,
                    "speed": 6,
                    "direction": "none",
                    "random": false,
                    "straight": false,
                    "out_mode": "out",
                    "bounce": false,
                    "attract": {
                        "enable": false,
                        "rotateX": 600,
                        "rotateY": 1200
                    }
                }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": {
                    "onhover": {
                        "enable": true,
                        "mode": "repulse"
                    },
                    "onclick": {
                        "enable": false,
                        "mode": "push"
                    },
                    "resize": true
                },
                "modes": {
                    "grab": {
                        "distance": 400,
                        "line_linked": {
                            "opacity": 1
                        }
                    },
                    "bubble": {
                        "distance": 400,
                        "size": 40,
                        "duration": 2,
                        "opacity": 8,
                        "speed": 3
                    },
                    "repulse": {
                        "distance": 200,
                        "duration": 0.4
                    },
                    "push": {
                        "particles_nb": 4
                    },
                    "remove": {
                        "particles_nb": 2
                    }
                }
            },
            "retina_detect": true
        });

        function copyScript() {
            const scriptText = document.querySelector('.script code').innerText;
            navigator.clipboard.writeText(scriptText).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }
    </script>
</body>
  </html>
