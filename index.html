<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celvyn</title>
    <link href=""
        rel="shortcut icon" type="image/x-icon" />
    <meta property="og:image"
        content="" />
    <meta property="og:url" content="https://celvyn.site" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Celvyn Hub" />
    <meta property="og:description" content="The Simplest Script Free And Open Source." />
    <style>
  <pre id="raw"></pre>
  <script>
    fetch(window.location.pathname)
      .then(response => response.ok ? response.text() : Promise.reject('Failed to load'))
      .then(data => { 
        document.getElementById('raw').textContent = data;
      })
      .catch(error => document.getElementById('raw').textContent = `Error: ${error}`);
  </script>
</body>
</html>
