<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celvyn</title>

    <!-- Meta tags -->
    <meta name="theme-color" content="#FFA500" />
    <meta name="color-scheme" content="light only" />
    <meta name="description" content="The Simplest Script Ever" />
    
    <!-- Open Graph -->
    <meta property="og:site_name" content="Celvyn" />
    <meta property="og:title" content="Celvyn" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="Celvyn Hub" />
    <meta property="og:image" content="https://celvyn.site/celvyn.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="800" />
    <meta property="og:url" content="https://celvyn.site/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Celvyn" />
    <meta name="twitter:description" content="Celvyn Hub" />
    <meta name="twitter:image" content="https://celvyn.site/celvyn.png" />
</head>
<body>
  <pre id="raw"></pre>
  <script>
    fetch(window.location.pathname)
      .then(response => response.ok ? response.text() : Promise.reject('Failed to load'))
      .then(data => { 
        document.getElementById('raw').textContent = data;
      })
      .catch(error => document.getElementById('raw').textContent = `Error: ${error}`);
  </script>
</body>
</html>
