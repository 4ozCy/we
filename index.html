<!DOCTYPE html>
<html lang="en">
<title>Celvyn</title>
<meta property="og:title" content="Celvyn - The Simplest Script Hub Ever" />
<meta property="og:description" content="Discover and run scripts easily with Celvyn — a free, open-source script hub made for simplicity." />
<meta property="og:url" content="https://celvyn.site" />
<meta property="og:type" content="website" />
<meta property="og:image" content="https://files.catbox.moe/qlqafm.png" />

<meta name="description" content="Celvyn is a free and open-source script hub focused on simplicity and speed." />
<meta name="keywords" content="script hub, Celvyn, exploit scripts, Roblox scripts, open-source script hub, Lua" />
<meta name="author" content="@.03cc" />
  <pre id="raw"></pre>
  <script>
    fetch(window.location.pathname)
      .then(response => response.ok ? response.text() : Promise.reject('Failed to load'))
      .then(data => { 
        document.getElementById('raw').textContent = data;
      })
      .catch(error => document.getElementById('raw').textContent = `Error: ${error}`);
  </script>
</body>
</html>
