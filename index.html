<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celvyn - Beta</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.25.0/themes/prism-tomorrow.min.css">
    <link href="https://fonts.cdnfonts.com/css/minecraft-3" rel="stylesheet">
    <style>
        body {
            font-family: 'Minecraft', sans-serif;
            width: 100%;
            margin: 0;
            padding: 0;
            background: #000;
            height: 120vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            flex-direction: column;
            gap: 20px;
            
        }

        #particles-js {
            position: absolute;
            width: 100%;
            height: 120vh;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .container {
            width: 90%;
            background: #19191a;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 3px 5px rgba(225, 225, 225, 0.3);
            text-align: center;
            animation: fadeIn 1s ease-out;
            position: relative;
            box-sizing: border-box;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        h1 {
            font-size: 1em;
        }
        
        .main-header h1 {
            font-size: 48px;
            font-weight: bold;
            margin: 0;
            color: #ffffff;
            animation: slideIn 1.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .main-header p {
            font-size: 20px;
            margin: 10px 0;
            color: #d3d3d3;
            
        }

        .logo {
            width: 200px;
            margin-bottom: 20px;
            animation: fadeIn 5s ease-out;
        }

        .features ul {
            list-style: none;
            padding: 0;
        }

        .features li {
            font-size: 18px;
            margin: 10px 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.3s;
        }

        .features li:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .features li span {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #00ff85;
            border-radius: 50%;
        }

        .script {
            background: #19191a;
            width: 85%;
            color: #38bdf8;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 3px 5px rgba(225, 225, 225, 0.3);
            text-align: left;
            font-size: 16px;
            overflow-x: auto;
            position: relative;
        }

        .copy-icon {
            position: absolute;
            top: 5px;
            right: 10px;
            cursor: pointer;
            font-size: 15px;
            color: white;
            transition: transform 0.3s, color 0.3s;
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>

    <img src="celvyn.png" alt="Celvyn Logo" class="logo">

    <div class="container main-header">
        <h1><span style="color: orange;">Celvyn</span> - <span style="color: lightgreen;">Beta</span></h1>
        <p>fast easy and simple</p>
    </div>
    
    <div class="container">
        <h1> Honorable Mention to <span style="color: orange;">Chatgpt</span> and <span style="color: lightgreen;"> Copilot</span></h1>
    </div>
    
    <div class="container features" id="features">
        <ul>
            <li><span></span> Aimbot & Esp</li>
            <li><span></span> Server hop</li>
            <li><span></span> Play random music</li>
            <li><span></span> Open Source</li>
            <li><span></span> More Coming soon..</li>
        </ul>
    </div>


        <div class="script">
            <pre><code class="language-lua">loadstring(game:HttpGet("https://raw.githubusercontent.com/4ozCy/Celvyn/refs/heads/main/Main.lua"))()</code></pre>
            <i class="fas fa-copy copy-icon" onclick="copyScript()"></i>
        </div>
 

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.25.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.25.0/components/prism-lua.min.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS.load('particles-js', 'particles.json', function() {
            console.log('Particles.js configuration loaded');
        });

        function copyScript() {
            const scriptText = document.querySelector('.script code').innerText;
            navigator.clipboard.writeText(scriptText).then(() => {
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }
    </script>
</body>
</html>
