<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celvyn</title>
    <meta property="og:title" content="Celvyn Hub" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="fast easy and simple." />
    <meta property="og:image" content="https://celvyn.site/laufey.jpg" />
    <meta name="theme-color" content="##fb9814">
    <meta name="twitter:card" content="summary_large_image">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.25.0/themes/prism-tomorrow.min.css">
    <link href="https://fonts.cdnfonts.com/css/minecraft-3" rel="stylesheet">
</head>
<body>
  <pre id="raw"></pre>
  <script>
    fetch(window.location.pathname)
      .then(response => response.ok ? response.text() : Promise.reject('Failed to load'))
      .then(data => { 
        document.getElementById('raw').textContent = data;
      })
      .catch(error => document.getElementById('raw').textContent = `Error: ${error}`);
  </script>
</body>
</html>
