<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.cdnfonts.com/css/minecraft-3" rel="stylesheet">
    <title>Celvyn - Beta</title>
    <style>
        body {
            font-family: 'Minecraft', sans-serif;
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 20px;
            background: black;
            min-height: 10vh;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }
        p {
            color: ghostwhite;
            font-size: 1.1em;
            margin-bottom: 20px;
        }
        .input-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }
        input[type="text"] {
            font-family: 'Minecraft', sans-serif;
            width: 70%;
            padding: 12px 15px;
            font-size: 1em;
            border: 2px solid #bdc3c7;
            border-radius: 25px;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        input[type="text"]:focus {
            border-color: #3498db;
            box-shadow: 0 0 8px rgba(52, 152, 219, 0.5);
        }
        button {
            font-family: 'Minecraft', sans-serif;
            padding: 12px 25px;
            background-color: lightgreen;
            color: black;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        button:active {
            transform: translateY(0);
        }
        .loader {
            display: none;
            border: 5px solid #ecf0f1;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            color: #2c3e50;
            font-size: 1em;
            word-break: break-all;
        }
        #result a {
            color: #3498db;
            text-decoration: none;
        }
        #result a:hover {
            text-decoration: underline;
        }
        #error {
            color: #e74c3c;
            font-weight: bold;
            margin-top: 15px;
            font-size: 1em;
        }
        .footer {
            margin-top: 40px;
            color: #7f8c8d;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <h1><span style="color: orange;">Cel</span><span style="color: lightgreen;">vyn</span></h1>
    <p>Enter a URL below to bypass.</p>
    
    <div class="input-container">
        <input type="text" id="urlInput" placeholder="https://example.com">
        <button onclick="bypassURL()">Bypass</button>
    </div>
    
    <div class="loader" id="loader"></div>
    <div id="result"></div>
    <div id="error"></div>
    

    <script>
        async function bypassURL() {
            const urlInput = document.getElementById('urlInput').value;
            const resultDiv = document.getElementById('result');
            const errorDiv = document.getElementById('error');
            const loader = document.getElementById('loader');

            resultDiv.innerHTML = '';
            errorDiv.innerHTML = '';
            loader.style.display = 'block';
            
            if (!urlInput.startsWith('http://') && !urlInput.startsWith('https://')) {
                errorDiv.innerHTML = 'Please enter a valid URL';
                loader.style.display = 'none';
                return;
            }

            try {
                const response = await fetch(`https://api.solar-x.top/api/v3/bypass?url=${encodeURIComponent(urlInput)}`);
                const data = await response.json();

                if (data.status === 'success' && data.result) {
                    resultDiv.innerHTML = `Bypassed URL: <a href="${data.result}" target="_blank">${data.result}</a>`;
                } else {
                    errorDiv.innerHTML = data.message || 'Failed to bypass URL';
                }
            } catch (error) {
                errorDiv.innerHTML = 'Error: Could not connect to the API';
                console.error(error);
            } finally {
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
