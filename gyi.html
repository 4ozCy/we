<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celvyn</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0d0d2b, #2a2a72);
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5), 0 0 60px rgba(255, 0, 255, 0.3);
            backdrop-filter: blur(10px);
            animation: pulse 4s infinite ease-in-out;
        }

        h1 {
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc;
            font-size: 2.5em;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        #ip-address {
            font-size: 2em;
            color: #ff00ff;
            text-shadow: 0 0 15px #ff00ff, 0 0 30px #ff00ff;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 30px;
            border-radius: 10px;
            transition: transform 0.3s ease;
            user-select: all;
        }

        #ip-address:hover {
            transform: scale(1.1);
        }

        .loading {
            animation: flicker 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 30px rgba(0, 255, 255, 0.5), 0 0 60px rgba(255, 0, 255, 0.3); }
            50% { box-shadow: 0 0 50px rgba(0, 255, 255, 0.7), 0 0 80px rgba(255, 0, 255, 0.5); }
            100% { box-shadow: 0 0 30px rgba(0, 255, 255, 0.5), 0 0 60px rgba(255, 0, 255, 0.3); }
        }

        @keyframes flicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
            20%, 24%, 55% { opacity: 0.5; }
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .buttons {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        button {
            padding: 10px 25px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            background: #00ffcc;
            color: #000;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #00ccb3;
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div class="container">
        <h1>Your IP Address</h1>
        <p id="ip-address" class="loading">Loading...</p>
        <div class="buttons">
            <button id="copy-btn">Copy</button>
            <button id="refresh-btn">Refresh</button>
        </div>
    </div>

    <script>
        function fetchIP() {
            const ipElement = document.getElementById('ip-address');
            ipElement.textContent = 'Loading...';
            ipElement.classList.add('loading');
            fetch('https://api.ipify.org?format=json')
                .then(res => res.json())
                .then(data => {
                    ipElement.textContent = data.ip;
                    ipElement.classList.remove('loading');
                })
                .catch(() => {
                    ipElement.textContent = 'Error fetching IP';
                    ipElement.classList.remove('loading');
                });
        }

        document.getElementById('refresh-btn').onclick = fetchIP;

        document.getElementById('copy-btn').onclick = () => {
            const ip = document.getElementById('ip-address').textContent;
            navigator.clipboard.writeText(ip);
        };

        fetchIP();

        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        const particleCount = 100;

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 5 + 1;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.size > 0.2) this.size -= 0.01;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = 'rgba(0, 255, 255, 0.8)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
                if (p.size <= 0.2) {
                    particles.splice(particles.indexOf(p), 1);
                    particles.push(new Particle());
                }
            });
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
