<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Celvyn</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.cdnfonts.com/css/minecraft-3" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Minecraft', sans-serif;
      background: linear-gradient(135deg, #e0e7ff, #f0fdfa);
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: #fff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 90%;
      max-width: 400px;
    }

    .icon {
      color: #4f46e5;
      margin-bottom: 10px;
    }

    h2 {
      margin: 10px 0 20px;
      font-weight: 600;
      color: #333;
    }

    input[type="file"] {
      margin: 15px 0;
      padding: 10px;
      border: 2px dashed #a5b4fc;
      border-radius: 8px;
      width: 100%;
      background-color: #f9fafb;
    }

    button {
      margin-top: 10px;
      background: #4f46e5;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #4338ca;
    }

    #result {
      margin-top: 20px;
      word-break: break-all;
      color: red;
    }

    a {
      color: #2563eb;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <i data-lucide="upload" style="width: 40px; height: 40px;"></i>
    </div>
    <h2>Upload Video or Image</h2>
    <form id="uploadForm">
      <input type="file" id="fileInput" name="file" accept="image/*,video/*" required />
      <button type="submit">
        <i data-lucide="arrow-up-circle" style="vertical-align: middle; width: 18px; height: 18px;"></i>
        Upload
      </button>
    </form>
    <div id="result"></div>
  </div>

  <script>
    lucide.createIcons();

    document.getElementById('uploadForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const file = document.getElementById('fileInput').files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append('file', file);

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/b', true);

      xhr.onload = function () {
        const result = document.getElementById('result');
        try {
          const response = JSON.parse(xhr.responseText);
          if (xhr.status === 200) {
            result.innerHTML = `Uploaded: <a href="${response.url}" target="_blank">${response.url}</a>`;
          } else {
            result.textContent = 'Error: ' + (response.error || 'Unknown error');
          }
        } catch (err) {
          result.textContent = 'Error parsing server response.';
        }
      };

      xhr.onerror = function () {
        document.getElementById('result').textContent = 'Upload failed.';
      };

      xhr.send(formData);
    });
  </script>
</body>
</html>
